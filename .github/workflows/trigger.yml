name: Reminder Trigger

on:
  schedule:
    # Every Friday 8pm PST = Saturday 04:00 UTC (runs until END_DATE=2026-03-20)
    - cron: '0 4 * * 6'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.RAILWAY_APP_URL }}
      TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
    steps:
      - name: Validate trigger config
        run: |
          test -n "$APP_URL"
          test -n "$TRIGGER_SECRET"

      - name: Trigger Railway app
        run: |
          response_file="$(mktemp)"
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" -X POST "${APP_URL}/trigger" \
            -H "Authorization: Bearer ${TRIGGER_SECRET}" \
            -H "Content-Type: application/json")

          echo "HTTP ${http_code}"
          cat "$response_file"

          test "$http_code" -ge 200
          test "$http_code" -lt 300
