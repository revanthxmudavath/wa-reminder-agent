name: Reminder Trigger

on:
  schedule:
    # TEST: Saturday Feb 28 11:00pm PST = 07:00 UTC Sunday Mar 1
    # PRODUCTION: Change to '0 4 * * 6' for every Friday 8pm PST (PST = UTC-8)
    - cron: '0 7 1 3 *'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render App
        run: |
          curl -s -X POST "${{ secrets.RENDER_APP_URL }}/trigger" \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail
