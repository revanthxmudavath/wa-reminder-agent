name: Reminder Trigger

on:
  schedule:
    # Every Friday 8pm PST = Saturday 04:00 UTC (runs until END_DATE=2026-03-20)
    - cron: '0 4 * * 6'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway App
        run: |
          curl -s -X POST "${{ secrets.RENDER_APP_URL }}/trigger" \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail
